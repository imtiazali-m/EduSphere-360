name: EduSphere 360 — build, verify and release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified build to the production Cloudflare Pages project
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify source and build production assets
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify project structure, navigation and security guards
        run: npm run verify:project

      - name: Test user-facing error handling
        run: npm run test:user-errors

      - name: Test finance calculations
        run: npm run test:finance

      - name: Test private file permissions
        run: npm run test:file-access

      - name: Build production website
        run: npm run build

      - name: Verify Cloudflare build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/_redirects
          test -d dist/assets
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Source maps found in dist. Review before publication."
          fi

      - name: Create Direct Upload ZIP with site files at archive root
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -q -r ../edusphere360-cloudflare-direct-upload.zip .
          cd ..
          test -s edusphere360-cloudflare-direct-upload.zip

      - name: Upload production dist folder
        uses: actions/upload-artifact@v7
        with:
          name: edusphere360-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cloudflare Direct Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: edusphere360-cloudflare-direct-upload
          path: edusphere360-cloudflare-direct-upload.zip
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Manually approved Cloudflare production deployment
    needs: verify-and-build
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.deploy_production == true &&
        github.ref == format('refs/heads/{0}', vars.EDUSPHERE_PRODUCTION_BRANCH || 'main')
      }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download verified production assets
        uses: actions/download-artifact@v7
        with:
          name: edusphere360-dist
          path: dist

      - name: Check release credentials and production configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'edusphere360' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo 'Missing Cloudflare Pages project name.'; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL repository variable.'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing VITE_SUPABASE_PUBLISHABLE_KEY repository variable.'; exit 1; }
          test -s dist/index.html
          test -s dist/_redirects

      - name: Deploy verified assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'edusphere360' }} --branch=${{ vars.EDUSPHERE_PRODUCTION_BRANCH || 'main' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
