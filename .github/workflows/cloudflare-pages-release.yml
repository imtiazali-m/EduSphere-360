name: EduSphere 360 — build, verify and release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified college website to the dedicated Government Islamia Degree College Badin Pages project
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify source and build production assets
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate exact role-aware route audit
        run: npm run audit:navigation

      - name: Generate role-aware route-to-view compatibility audit
        run: npm run audit:route-views

      - name: Generate responsive source coverage audit
        run: npm run audit:responsive

      - name: Audit modal keyboard behavior and specialist workspace visual coverage
        run: npm run audit:modal-windows

      - name: Verify project structure, navigation and security guards
        run: npm run verify:project

      - name: Test user-facing error handling
        run: npm run test:user-errors

      - name: Test finance calculations
        run: npm run test:finance

      - name: Test private file permissions
        run: npm run test:file-access

      - name: Test teacher account provisioning guards
        run: npm run test:account-provisioning

      - name: Install isolated Playwright tooling and verify runner Chrome
        run: |
          mkdir -p /tmp/edusphere-playwright
          npm install --prefix /tmp/edusphere-playwright --no-save --no-package-lock playwright@1.56.1
          google-chrome --version
          test -x /usr/bin/google-chrome

      - name: Build production website
        run: npm run build

      - name: Verify Cloudflare build output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/_redirects
          test -d dist/assets
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Source maps found in dist. Review before publication."
          fi

      - name: Test welcome, role-specific login and owner setup across viewport sizes
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/edusphere-playwright/node_modules/playwright
        run: npm run test:responsive:public

      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edusphere-responsive-qa
          path: artifacts/responsive-public/
          if-no-files-found: warn
          retention-days: 14

      - name: Create Direct Upload ZIP with site files at archive root
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -q -r ../gidcbadin-cloudflare-direct-upload.zip .
          cd ..
          test -s gidcbadin-cloudflare-direct-upload.zip

      - name: Upload route-to-view compatibility audit
        uses: actions/upload-artifact@v7
        with:
          name: gidcbadin-route-view-audit
          path: docs/PHASE_1_ROUTE_VIEW_AUDIT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload responsive source coverage audit
        uses: actions/upload-artifact@v7
        with:
          name: gidcbadin-responsive-source-audit
          path: docs/PHASE_2_RESPONSIVE_SOURCE_AUDIT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact role-aware route audit
        uses: actions/upload-artifact@v7
        with:
          name: gidcbadin-exact-route-audit
          path: docs/PHASE_1_EXACT_ROUTE_AUDIT.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload production dist folder
        uses: actions/upload-artifact@v7
        with:
          name: gidcbadin-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cloudflare Direct Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: gidcbadin-cloudflare-direct-upload
          path: gidcbadin-cloudflare-direct-upload.zip
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Manually approved Cloudflare production deployment
    needs: verify-and-build
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true)
        )
      }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download verified production assets
        uses: actions/download-artifact@v7
        with:
          name: gidcbadin-dist
          path: dist

      - name: Check release credentials and production configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gidcbadin
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo 'Missing Cloudflare Pages project name.'; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL repository variable.'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing VITE_SUPABASE_PUBLISHABLE_KEY repository variable.'; exit 1; }
          test -s dist/index.html
          test -s dist/_redirects

      - name: Ensure the college-named Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: gidcbadin
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          projects="$(curl --fail-with-body --silent --show-error "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if jq -e --arg project "$CLOUDFLARE_PAGES_PROJECT" '.result | any(.[]; .name == $project)' <<<"$projects" >/dev/null; then
            echo "Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT already exists."
          else
            payload="$(jq -n --arg name "$CLOUDFLARE_PAGES_PROJECT" '{name:$name,production_branch:"main"}')"
            created="$(curl --fail-with-body --silent --show-error -X POST "$api" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")"
            jq -e '.success == true' <<<"$created" >/dev/null
            echo "Created Cloudflare Pages project $CLOUDFLARE_PAGES_PROJECT."
          fi

      - name: Deploy verified assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gidcbadin --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
