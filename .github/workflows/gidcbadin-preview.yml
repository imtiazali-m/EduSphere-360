name: GIDC Badin — Cloudflare Pages

on:
  push:
    branches:
      - premium-institutional-theme
      - main

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify GIDC source and build deployment assets
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out the GIDC review branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify routes, workspaces and security guards
        run: |
          npm run audit:navigation
          npm run audit:route-views
          npm run audit:responsive
          npm run audit:modal-windows
          npm run verify:project

      - name: Run regression suites
        run: |
          npm run test:user-errors
          npm run test:device-signature
          npm run test:device-review
          npm run test:online-session-security
          npm run test:ai-free-provider
          npm run test:finance
          npm run test:file-access
          npm run test:account-provisioning

      - name: Type-check application
        run: npm run typecheck

      - name: Install isolated Playwright tooling
        run: |
          mkdir -p /tmp/edusphere-playwright
          npm install --prefix /tmp/edusphere-playwright --no-save --no-package-lock playwright@1.56.1
          google-chrome --version
          test -x /usr/bin/google-chrome

      - name: Build production website
        run: npm run build

      - name: Verify Cloudflare build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/_redirects
          test -d dist/assets
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Source maps found in dist. Review before publication."
          fi

      - name: Test GIDC public screens across viewport sizes
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/edusphere-playwright/node_modules/playwright
        run: npm run test:responsive:public

      - name: Upload verified GIDC preview assets
        uses: actions/upload-artifact@v7
        with:
          name: gidcbadin-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: Deploy GIDC Pages site for this branch
    needs: verify-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/premium-institutional-theme'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download verified GIDC preview assets
        uses: actions/download-artifact@v7
        with:
          name: gidcbadin-preview-dist
          path: dist

      - name: Verify GIDC Cloudflare deployment target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s dist/index.html
          test -s dist/_redirects
          echo "Target is GIDC Cloudflare Pages project: gidcbadin; branch: $GITHUB_REF_NAME"

      - name: Deploy GIDC Badin to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gidcbadin --branch=${{ github.ref_name }}
