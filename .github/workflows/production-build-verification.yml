name: EduSphere 360 production build verification

on:
  push:
    branches: ["release/qa-build-20261108"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production website
        run: npm run build

      - name: Verify Cloudflare static output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/_redirects
          test -d dist/assets

      - name: Upload build output for review
        uses: actions/upload-artifact@v7
        with:
          name: edusphere360-qa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
