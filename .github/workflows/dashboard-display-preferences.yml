name: Dashboard display preferences regression and build

on:
  push:
    paths:
      - 'src/components/Dashboard.tsx'
      - 'src/lib/displayPreferences.js'
      - 'src/lib/displayPreferences.d.ts'
      - 'src/styles/dashboard-display-settings.css'
      - 'src/main.tsx'
      - 'scripts/test-display-preferences.mjs'
      - 'scripts/verify-project.mjs'
      - 'package.json'
      - '.github/workflows/dashboard-display-preferences.yml'
  pull_request:
    paths:
      - 'src/components/Dashboard.tsx'
      - 'src/lib/displayPreferences.js'
      - 'src/lib/displayPreferences.d.ts'
      - 'src/styles/dashboard-display-settings.css'
      - 'src/main.tsx'
      - 'scripts/test-display-preferences.mjs'
      - 'scripts/verify-project.mjs'
      - 'package.json'
      - '.github/workflows/dashboard-display-preferences.yml'

permissions:
  contents: read

jobs:
  dashboard-display-preferences:
    name: Verify display modes, preferences and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test device-local display preference storage and validation
        run: npm run test:display-preferences
      - name: Generate exact role-aware route audit
        run: npm run audit:navigation
      - name: Generate role-aware route-to-view compatibility audit
        run: npm run audit:route-views
      - name: Generate responsive source coverage audit
        run: npm run audit:responsive
      - name: Audit modal keyboard behavior and specialist workspace visual coverage
        run: npm run audit:modal-windows
      - name: Verify route, permission and workspace invariants
        run: npm run verify:project
      - name: Type-check application
        run: npm run typecheck
      - name: Build production assets
        run: npm run build
