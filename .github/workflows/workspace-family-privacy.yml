name: Workspace family privacy regression and build

on:
  push:
    paths:
      - 'src/components/InstitutionalWorkspace.tsx'
      - 'src/lib/workspacePrivacy.js'
      - 'src/lib/workspacePrivacy.d.ts'
      - 'scripts/test-workspace-privacy.mjs'
      - 'scripts/verify-project.mjs'
      - 'supabase/migrations/20261111160000_institutional_record_review_isolation.sql'
      - 'supabase/migrations/README.md'
      - 'docs/WORKSPACE_ROLE_PRIVACY.md'
      - 'package.json'
      - '.github/workflows/workspace-family-privacy.yml'
  pull_request:
    paths:
      - 'src/components/InstitutionalWorkspace.tsx'
      - 'src/lib/workspacePrivacy.js'
      - 'src/lib/workspacePrivacy.d.ts'
      - 'scripts/test-workspace-privacy.mjs'
      - 'scripts/verify-project.mjs'
      - 'supabase/migrations/20261111160000_institutional_record_review_isolation.sql'
      - 'supabase/migrations/README.md'
      - 'docs/WORKSPACE_ROLE_PRIVACY.md'
      - 'package.json'
      - '.github/workflows/workspace-family-privacy.yml'

permissions:
  contents: read

jobs:
  verify-workspace-privacy:
    name: Verify role-scoped workspace exports and database review isolation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run workspace privacy regression tests
        run: npm run test:workspace-privacy

      - name: Generate exact role-aware route audit
        run: npm run audit:navigation

      - name: Generate role-aware route-to-view compatibility audit
        run: npm run audit:route-views

      - name: Generate responsive source coverage audit
        run: npm run audit:responsive

      - name: Audit modal keyboard behavior and specialist workspace visual coverage
        run: npm run audit:modal-windows

      - name: Verify complete project structure and permissions
        run: npm run verify:project

      - name: Build production assets
        run: npm run build
