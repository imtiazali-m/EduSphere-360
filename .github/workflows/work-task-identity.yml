name: Work task identity regression and build

on:
  push:
    paths:
      - 'src/lib/data.ts'
      - 'src/lib/workTaskAccess.js'
      - 'src/lib/workTaskAccess.d.ts'
      - 'scripts/test-work-task-identity.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/work-task-identity.yml'
  pull_request:
    paths:
      - 'src/lib/data.ts'
      - 'src/lib/workTaskAccess.js'
      - 'src/lib/workTaskAccess.d.ts'
      - 'scripts/test-work-task-identity.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/work-task-identity.yml'

permissions:
  contents: read

jobs:
  verify-work-task-identity:
    name: Verify stable work-task assignment identity
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate exact role-aware route audit
        run: npm run audit:navigation

      - name: Generate role-aware route-to-view compatibility audit
        run: npm run audit:route-views

      - name: Generate responsive source coverage audit
        run: npm run audit:responsive

      - name: Audit modal keyboard behavior and specialist workspace visual coverage
        run: npm run audit:modal-windows

      - name: Test stable identity and compatibility rules
        run: node scripts/test-work-task-identity.mjs

      - name: Verify complete project structure and permissions
        run: npm run verify:project

      - name: Build production assets
        run: npm run build
